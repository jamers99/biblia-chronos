  <circle cx="214" cy="190" r="20" fill="#f7f3ea"/>
  <rect x="236" y="304" width="132" height="22" rx="11" fill="#f7f3ea"/>
  <rect x="150" y="346" width="96" height="22" rx="11" fill="#f7f3ea" fill-opacity=".55"/>
